# Dependabot keeps two things current: the pinned GitHub Actions in .github/workflows and the
# Python stack in uv.lock. Both are grouped into one PR per ecosystem per interval so review is a
# single diff rather than a drip of thirty.
#
# A `uv` update PR changes uv.lock only. docker/requirements.txt is a *derived* export of the lock
# (see Makefile `lock`), so the CI `lock-check` job fails on that PR until someone checks out the
# branch, runs `make lock`, and commits the regenerated requirements.txt. That is the intended
# behaviour — the gate exists so the container never builds from a stale export — and the fix is
# one command.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
    # Ceilings pyproject.toml sets on purpose (each one is explained next to its pin): pandas <3 and
    # numpy <2 for neuralprophet, torch on the 2.13 line for the CUDA 12.6 build the T4 hosts need,
    # dataproc-spark-connect <1.0 for Dataproc runtime 2.3 parity. Dependabot must not propose
    # widening them; a human raises a ceiling when the reason behind it is gone.
    ignore:
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      - dependency-name: torch
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: dataproc-spark-connect
        update-types: ["version-update:semver-major"]
