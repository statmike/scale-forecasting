name: ci

# Three guarantees on every push / PR:
#   1. lock-check — the dependency stack never drifts. uv.lock must be in sync with pyproject.toml,
#      and docker/requirements.txt (the derived export the container + packed-venv build from) must
#      equal what the lock produces. This is the automated half of the "one source of truth" design:
#      a hand-edited requirements.txt, or a pyproject change that wasn't re-locked, fails here.
#   2. offline — the code gate that needs no cloud: ruff + mypy + the offline test suite. Interpreter
#      and every dependency come from the same uv.lock + .python-version the runtime image is built
#      from, so a green CI run reflects the exact versions production runs.
#   3. core-install — `pip install scale-forecasting` with no extra is a working forecasting
#      toolkit, and the first call that needs Google Cloud or matplotlib names the extra to install.
#      Checked in a bare venv built from the wheel, because only that proves the packaging metadata
#      (the offline suite mirrors it with an import blocker in tests/unit/test_core_install.py).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1  # this action publishes no floating major tag; pin exact
      # The lock must already satisfy pyproject.toml (no re-resolve needed).
      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check
      # Regenerate the derived requirements export and fail if the committed file differs. Keep these
      # flags identical to the Makefile `lock` target and docker/requirements.txt's header.
      - name: docker/requirements.txt matches the lock
        run: |
          uv export --frozen --no-emit-project --no-dev --no-hashes \
            --extra gcp --extra models --extra ray --format requirements-txt -o docker/requirements.txt
          git diff --exit-code docker/requirements.txt \
            || { echo "::error::docker/requirements.txt is stale — run 'make lock' and commit."; exit 1; }

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # Install the interpreter (.python-version → 3.11.15) + all extras + dev group from the lock.
      - run: uv sync --frozen --all-extras
      # Layout is machine-decided (`make format` fixes any failure here), so review reads diffs of
      # meaning rather than of whitespace — and hand-reflowing a long line can't silently corrupt a
      # docstring, which it has.
      - name: ruff format
        run: uv run ruff format --check src tests
      - name: ruff
        run: uv run ruff check src tests
      # The package ships py.typed, so every public signature is a promise to downstream checkers.
      # Zero errors is the bar (pyproject [tool.mypy]); tests stay dynamically typed on purpose.
      - name: mypy
        run: uv run mypy src/scale_forecasting
      - name: offline test gate
        run: uv run pytest -m "not gcp and not spark and not ray" -q

  # core-install — the bare-install contract, in a venv that has genuinely nothing optional in it.
  # `uv pip install .` builds the wheel and installs it the way `pip install scale-forecasting`
  # will, so what runs here is the published metadata, not the editable checkout. pytest is added
  # afterwards only to drive the one test; it pulls no optional package of ours.
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: install the wheel with no extras
        run: |
          uv venv --python 3.11 .venv-core
          uv pip install --python .venv-core/bin/python . pytest
      - name: nothing optional is present
        run: |
          .venv-core/bin/python - <<'EOF'
          import importlib.util
          optional = ["google", "matplotlib", "ipykernel", "pyspark", "ray", "torch", "xgboost",
                      "lightgbm", "catboost", "prophet", "statsforecast", "db_dtypes"]
          present = [m for m in optional if importlib.util.find_spec(m) is not None]
          assert not present, f"a bare install pulled optional packages: {present}"
          EOF
      - name: the pure layer works and the cloud entry points name the extra
        run: .venv-core/bin/python -m pytest tests/unit/test_core_install.py -q -p no:cacheprovider
      - name: "[gcp] adds the clients"
        run: |
          uv pip install --python .venv-core/bin/python ".[gcp]"
          .venv-core/bin/python - <<'EOF'
          import google.cloud.aiplatform_v1, google.cloud.bigquery, google.cloud.dataproc_v1
          import google.cloud.storage
          import scale_forecasting.registry.reads
          from scale_forecasting.errors import require_extra
          require_extra("gcp", purpose="CI")
          print("[gcp] ok")
          EOF

  # airflow-parse — the cheap "does Airflow actually parse the emitted DAG?" gate. Airflow is heavy
  # and prone to dependency conflicts with our torch/ray/spark pins, so it is deliberately NOT in
  # uv.lock: this job installs it ISOLATED (core+dev synced from the lock, then apache-airflow pinned
  # to Composer 3's image version against Airflow's official constraints) and runs only the @airflow
  # tests. A resolution problem here can never break the main offline gate above.
  airflow-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # Core + dev (pytest) + the editable package, no heavy extras — the DAG parse only needs the
      # package's light modules (airflow_tasks imports nothing heavy at module load).
      - run: uv sync --frozen
      # Match Composer 3's Airflow (composer-3-airflow-2.10.5); the constraints file pins Airflow's
      # own transitive stack for Python 3.11 so the install is reproducible. That file pins
      # typing_extensions OLDER than our pydantic_core needs (it imports Sentinel), so restore a
      # compatible version afterward — Airflow tolerates the newer one.
      - name: install Airflow (isolated, constraints-pinned) into the synced venv
        run: |
          uv pip install "apache-airflow==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
          uv pip install -U typing_extensions
      # Call the venv's pytest directly — `uv run` would re-sync the env to uv.lock and drop Airflow
      # (which is intentionally not in the lock).
      - name: parse the emitted DAG under Airflow
        run: .venv/bin/python -m pytest -m airflow -q
