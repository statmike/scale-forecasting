[project]
name = "scale-forecasting"
version = "0.1.0"
description = "Massively-parallel time-series forecasting on Google Cloud — Spark, Ray, and BigQuery, one config away."
readme = "README.md"
# 3.11 is the single tested/supported version everywhere: Vertex Ray client↔cluster parity at 2.47,
# the Dataproc packed-venv is built against 3.11, and notebook 01's interactive Spark Connect path
# runs on Dataproc runtime 2.3 — whose workers are ALSO 3.11, so driver↔worker parity holds on the
# one sf-main (py3.11) template. No Python 3.12 anywhere, so the ceiling is <3.12.
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "scale-forecasting contributors" }]

# Core dependencies: the pure forecasting + orchestration layer that runs anywhere
# (local notebook or Airflow). Heavy compute backends live in optional groups so a
# data scientist can `uv sync` and read/run the core without pulling Spark or Ray.
dependencies = [
    "pydantic>=2.7",
    # pandas is capped <3 because neuralprophet (the [models] deep-learning model) still calls the
    # Series.view API that pandas 3.0 removed, so it can't fit under 3.x. Our own code uses no
    # pandas-3-only idioms, so 2.2.x is a clean floor↔ceiling for the whole product.
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    # Caps the native BLAS/OpenMP thread pools around a profiling probe fit, so the measured
    # cpu/wall ratio describes the model rather than the core count of whatever machine ran the
    # pre-pass (unpinned, that ratio read 19.7 on a 32-core box; pinned it reads 1.0). A
    # transitive dep of scikit-learn above, pinned explicit because `profiling.measure` imports it
    # directly (the same rule protobuf follows below). It is half the fix, not the whole one:
    # it re-sizes the pools of libraries already loaded, while OMP_NUM_THREADS and friends cap
    # the pool of a library loaded later, during the fit itself. `profiling.measure` sets both.
    "threadpoolctl>=3.1",
    "optuna>=3.6",
    "holidays>=0.50",
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "google-cloud-storage>=2.17",
    # BigQuery→pandas conversion (client.query(...).to_dataframe()) maps DATE / NUMERIC columns
    # through db-dtypes; the BigQuery-native engine reads its held-out eval back this way.
    "db-dtypes>=1.2",
    # Storage Write API rows are protobuf: registry/bq.py builds a dynamic descriptor per
    # cell table and serializes rows against it (a transitive dep of the google libs above,
    # pinned explicit because we import google.protobuf directly).
    "protobuf>=4.25",
    # Notebook kernel. Driving a run from a local notebook (or Colab Enterprise) is a
    # first-class use — many notebooks are pure orchestration of the Dataproc/Ray/BigQuery
    # work — so the kernel ships in core, not a dev extra: `uv sync` then register a kernel
    # (`uv run python -m ipykernel install --user --name scale-forecasting`).
    "ipykernel>=6.29",
    # The notebooks plot forecasts + their intervals and the scale-review charts; matplotlib
    # is their only extra import beyond pandas/google, so it rides in core with the kernel.
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Python runtime A — Dataproc Serverless (Spark). Installed on the cluster via the
# packed-venv archive; a data scientist only needs this locally to test UDF wiring.
spark = [
    "pyspark>=3.5",
    "google-cloud-dataproc>=5.9",
    # Client-side only — lets a notebook drive the engine over a Dataproc Spark Connect endpoint
    # (an injected DataprocSparkSession). NEVER imported by the engine modules (they run on-cluster
    # against a classic session), so the same engine code runs as a batch and over Connect (G1).
    # Capped <1.0 on purpose: 0.7.x brings pyspark 3.5 (py3.11-compatible) and defaults to runtime
    # 2.3 (Spark 3.5 / py3.11 workers), which is what notebook 01 targets. The 1.x line pins
    # pyspark 4.0 AND hard-codes a client-side runtime-3.0 floor (py3.12 workers) — that would break
    # driver↔worker parity on the single py3.11 build. Keep the client on the 0.7 line.
    "dataproc-spark-connect>=0.7,<1.0",
]
# Python runtime B — Ray on Vertex AI.
ray = [
    # Vertex AI supports only a fixed set of Ray cluster-image versions, and the client-side Ray must
    # MATCH the cluster's or the JobSubmissionClient handshake (GET /api/version) hangs → HTTP 524.
    # On Python 3.11 the supported versions are 2.42 and 2.47; we run 2.47.1, so cap the client to that
    # range (an unbounded >= floats to a newer, unsupported Ray — the original cause of the 524).
    "ray[default]>=2.42,<2.48",
    "google-cloud-aiplatform>=1.60",
    # vertex_ray imports immutabledict at module load; aiplatform only declares it under its own
    # [ray] extra, which would pin ray[default]<=2.47.1 and conflict with ours — so pull it directly.
    "immutabledict>=4.0",
]
# Submit-only client set — everything needed to LAUNCH runs from a thin client (Cloud Shell, CI)
# without the on-cluster runtimes. The three batch entrypoints (`main --dry-run`, `submit`,
# `ray_submit`) build API messages via these clients and never import pyspark (spark_io imports it
# only under TYPE_CHECKING), so this deliberately OMITS the [spark] extra's pyspark (~300MB of JARs
# that overflow Cloud Shell's home quota and are only needed for notebook 01's interactive Connect
# path, which runs in Colab). It is the union of the dataproc submit client + the [ray] client deps.
submit = [
    "google-cloud-dataproc>=5.9",
    "ray[default]>=2.42,<2.48",
    "google-cloud-aiplatform>=1.60",
    "immutabledict>=4.0",
]
# Boosted-tree and deep-learning models (optional — heavier installs).
models = [
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "prophet>=1.1.5",
    "neuralprophet>=0.9",
    # torch is transitive via neuralprophet, but we pin it explicitly to bind the CUDA build below.
    # NeuralProphet is the only GPU model, and it runs on Ray-on-Vertex T4s whose host driver
    # (535.x) caps at CUDA 12.2. The default PyPI torch wheel is a CUDA-13 build that refuses to
    # init against that driver ("driver too old"), so on Linux we must take a CUDA-12.x build (see
    # [tool.uv.sources] below). Same version, just the cu126 variant — 12.x minor-version
    # compatibility lets a 12.6-built wheel run on the 535 driver.
    "torch>=2.13,<2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2,<3",
    # Parses the executed notebooks the acceptance harness downloads, to scan for cell errors
    # (scale_forecasting.notebook_acceptance). Dev-only: the harness is a test/CI tool, not part of
    # the shipped forecasting runtime, so it doesn't belong in core deps.
    "nbformat>=5.10",
]
# Documentation site (MkDocs Material + mkdocstrings). Builds the guides, the notebook tour, and an
# API reference generated straight from the source docstrings. mkdocstrings-python uses griffe's
# STATIC analysis (it reads src/, never imports the package), so the site builds without the heavy
# compute backends (statsmodels/scipy/torch) or a resolved runtime — CI stays light.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-jupyter>=0.25",
]

# --- torch CUDA build selection (Ray-on-Vertex T4 GPU path) --------------------------------------
# torch defaults to a CUDA-13 wheel on PyPI, which won't initialize on the Vertex T4 host driver
# (535.x → CUDA 12.2 max). Pull the CUDA-12.6 build FROM the PyTorch index, but only on Linux
# x86_64 — the runtime image (docker/Dockerfile) and every cluster node. On macOS / other platforms
# (local dev) there is no CUDA wheel, so we fall back to the default PyPI build (CPU/MPS), keeping
# `uv sync` working everywhere. The [ray]/@gpu path is Linux-only by construction, so this is the
# only place the GPU build is needed.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scale_forecasting"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible, non-noisy defaults: pyflakes, pycodestyle, isort, bugbear, pyupgrade.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["scale_forecasting"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Scientific / ML libraries that ship no type stubs. We depend on them at runtime but
# treat their surfaces as untyped rather than vendoring stubs.
[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "scipy.*",
    "xgboost.*",
    "lightgbm.*",
    "prophet.*",
    "neuralprophet.*",
    "sklearn.*",
]
ignore_missing_imports = true

# pyspark is runtime-mounted on Dataproc Serverless (the optional [spark] extra); engines/seed
# import it lazily inside run()/main(). We treat its surface as untyped — `follow_imports = "skip"`
# (not just ignore_missing_imports) so the result is identical whether or not the extra happens to
# be installed in the current venv, keeping the mypy gate reproducible across dev/CI/cluster.
[[tool.mypy.overrides]]
module = ["pyspark.*"]
ignore_missing_imports = true
follow_imports = "skip"

# google.protobuf ships no py.typed marker in our resolved version; we touch it only to
# build the dynamic Storage Write API descriptor in registry/bq.py. Treat as untyped rather
# than pin types-protobuf (which must track the runtime protobuf version).
[[tool.mypy.overrides]]
module = ["google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gcp: requires a GCP project + ADC (integration; off by default)",
    "spark: needs a local or serverless Spark session",
    "ray: needs a local or remote Ray runtime",
    "raylive: provisions a live (billed) Vertex Ray cluster — CPU-only, opt-in",
    "gpu: needs a real GPU (T4)",
    "slow: long-running (scale smokes)",
    "airflow: needs apache-airflow installed (parses an emitted DAG; opt-in, isolated)",
]
