[project]
name = "scale-forecasting"
version = "0.1.0"
description = "Time-series forecasting on Google Cloud at any scale: one JSON configuration runs every model family on Dataproc Serverless, Ray, Vertex AI, GKE, Compute Engine, or BigQuery ML and writes forecasts and leaderboards back to BigQuery."
readme = "README.md"
# 3.11 is the single tested/supported version everywhere: Vertex Ray client↔cluster parity at 2.47,
# the Dataproc packed-venv is built against 3.11, and notebook 01's interactive Spark Connect path
# runs on Dataproc runtime 2.3 — whose workers are ALSO 3.11, so driver↔worker parity holds on the
# one sf-main (py3.11) template. No Python 3.12 anywhere, so the ceiling is <3.12.
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "scale-forecasting contributors" }]

# Core dependencies: the pure forecasting layer — config, the 34 model plugins' shared base, the 21
# metrics, features, backtests, calibration, reconciliation, ensembling, HPO, the worker, and the
# playground. Nothing here talks to a cloud API. A bare `pip install scale-forecasting` is enough to
# run `python -m scale_forecasting.playground` on synthetic data with no project, no billing, and
# no credentials; everything that touches Google Cloud is the [gcp] extra below.
dependencies = [
    "pydantic>=2.7",
    # pandas is capped <3 because neuralprophet (the [models] deep-learning model) still calls the
    # Series.view API that pandas 3.0 removed, so it can't fit under 3.x. Our own code uses no
    # pandas-3-only idioms, so 2.2.x is a clean floor↔ceiling for the whole product.
    "pandas>=2.2,<3",
    # numpy is capped <2 because neuralprophet references np.NaN, which NumPy 2.0 removed.
    "numpy>=1.26,<2",
    "pyarrow>=16.0",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    # Caps the native BLAS/OpenMP thread pools around a profiling probe fit, so the measured
    # cpu/wall ratio describes the model rather than the core count of whatever machine ran the
    # pre-pass (unpinned, that ratio read 19.7 on a 32-core box; pinned it reads 1.0). A
    # transitive dep of scikit-learn above, pinned explicit because `profiling.measure` imports it
    # directly (the same rule protobuf follows below). It is half the fix, not the whole one:
    # it re-sizes the pools of libraries already loaded, while OMP_NUM_THREADS and friends cap
    # the pool of a library loaded later, during the fit itself. `profiling.measure` sets both.
    "threadpoolctl>=3.1",
    "optuna>=3.6",
    "holidays>=0.50",
]

[project.optional-dependencies]
# Google Cloud clients — every one the package imports, the way `apache-beam[gcp]` means "every
# Google client Beam can use". The pure layer needs none of them; `pip install
# "scale-forecasting[gcp]"` is the install for anyone running on Google Cloud. The package has zero
# top-level `google.*` imports; `errors.require_extra("gcp")` at the entry points turns a missing
# client into one sentence naming this extra instead of a ModuleNotFoundError from inside a job.
# What stays outside it is only the two non-Google runtimes' own client libraries: pyspark
# ([spark]) and ray ([ray]).
gcp = [
    # BigQuery (the registry and the BigQuery-native engine), the Storage Read API (worker
    # sharding), Cloud Storage (code delivery, artifacts).
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "google-cloud-storage>=2.17",
    # The launch clients: Dataproc Serverless batches and clusters (`submit`), and the Vertex AI
    # JobServiceClient / PipelineServiceClient behind the `vertex` CustomJob and `vertex_automl`
    # runtimes (`vertex_submit`, `automl_submit`) plus `vertex_ray` for Ray on Vertex. The GCE and
    # GKE submitters use google.auth's `AuthorizedSession` against the REST APIs instead of
    # per-product SDKs, so there is nothing to add for them.
    "google-cloud-dataproc>=5.9",
    "google-cloud-aiplatform>=1.60",
    # Both arrive transitively through the clients above, pinned explicit because we import them by
    # name: google.auth (ADC, `AuthorizedSession`) and google.api_core (`exceptions`,
    # `client_options`). A module we import by name is a dependency we declare by name.
    "google-auth>=2.30",
    "google-api-core>=2.19",
    # BigQuery→pandas conversion (client.query(...).to_dataframe()) maps DATE / NUMERIC columns
    # through db-dtypes; the BigQuery-native engine reads its held-out eval back this way.
    "db-dtypes>=1.2",
    # Storage Write API rows are protobuf: registry/write_api.py builds a dynamic descriptor per
    # cell table and serializes rows against it (a transitive dep of the google libs above,
    # pinned explicit because we import google.protobuf directly).
    "protobuf>=4.25",
]
# Notebook kernel + plotting. Driving a run from a local notebook (or Colab Enterprise) is a
# first-class use, so these are one named extra rather than a dev afterthought: register a kernel
# with `uv run python -m ipykernel install --user --name scale-forecasting`. matplotlib is the only
# import the forecast / interval / scale-review charts in `review.py` and `sdk.plot_trace` need
# beyond pandas; they import it lazily and name this extra when it is missing.
notebook = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]
# Python runtime A — Dataproc Serverless (Spark). Installed on the cluster via the
# packed-venv archive; a data scientist only needs this locally to test UDF wiring or to drive the
# engine over Spark Connect from a notebook. Submitting a batch needs only [gcp] (the Dataproc
# client lives there); this adds the Spark client itself.
spark = [
    "scale-forecasting[gcp]",
    "pyspark>=3.5",
    # Client-side only — lets a notebook drive the engine over a Dataproc Spark Connect endpoint
    # (an injected DataprocSparkSession). NEVER imported by the engine modules (they run on-cluster
    # against a classic session), so the same engine code runs as a batch and over Connect (G1).
    # Capped <1.0 on purpose: 0.7.x brings pyspark 3.5 (py3.11-compatible) and defaults to runtime
    # 2.3 (Spark 3.5 / py3.11 workers), which is what notebook 01 targets. The 1.x line pins
    # pyspark 4.0 AND hard-codes a client-side runtime-3.0 floor (py3.12 workers) — that would break
    # driver↔worker parity on the single py3.11 build. Keep the client on the 0.7 line.
    "dataproc-spark-connect>=0.7,<1.0",
]
# Python runtime B — Ray on Vertex AI and Ray on GKE. Submitting a Ray job needs Ray's own
# `JobSubmissionClient`, which only ships with the ray distribution — the one launch client that
# is not a Google library, hence not in [gcp].
ray = [
    "scale-forecasting[gcp]",
    # Require ray>=2.52 for security vulnerability remediation. Client-side job submission uses the
    # HTTP REST Ray Jobs API (`JobSubmissionClient` over PSC-I), which is wire-compatible with Vertex
    # AI's managed 2.47.1 cluster image (`ray_infra.py` keeps `_DEFAULT_RAY_VERSION = "2.47"` and
    # `code_delivery.py` excludes `ray` from the on-cluster `runtime_env` package list).
    "ray[default]>=2.52",
    # vertex_ray imports immutabledict at module load; aiplatform only declares it under its own
    # [ray] extra, which would pin ray[default]<=2.47.1 and conflict with ours — so pull it directly.
    "immutabledict>=4.0",
]
# Thin launch client — everything needed to LAUNCH a run on any runtime from Cloud Shell or CI
# without pyspark (~300MB of JARs that overflow Cloud Shell's home quota and are only needed for
# the interactive Spark Connect path). Every Google launch client is in [gcp] and the Ray client is
# in [ray], so this is [ray] under the name the operations runbook uses.
submit = [
    "scale-forecasting[ray]",
]
# Granular model extras for environment agility — install individual model libraries
# when enterprise environments restrict specific packages, or install `models` for the full suite.
# 15 of the 34 models run on the core install alone (numpy / scipy / statsmodels / scikit-learn);
# these extras add the 17 that need a third-party or cloud library, and the two BigQuery ML models
# need [gcp]. docs/models_reference.md maps each extra to its models.
models-stats = [
    "statsforecast>=2.0",
]
models-trees = [
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
]
models-prophet = [
    "prophet>=1.1.5",
]
models-dl = [
    "neuralprophet>=0.9",
    "neuralforecast>=1.7",
    # torch is transitive via neuralprophet, but we pin it explicitly to bind the CUDA build below.
    # NeuralProphet is the only GPU model, and it runs on Ray-on-Vertex T4s whose host driver
    # (535.x) caps at CUDA 12.2. The default PyPI torch wheel is a CUDA-13 build that refuses to
    # init against that driver ("driver too old"), so on Linux we must take a CUDA-12.x build (see
    # [tool.uv.sources] below). Same version, just the cu126 variant — 12.x minor-version
    # compatibility lets a 12.6-built wheel run on the 535 driver.
    "torch>=2.13,<2.14",
]
# The four Vertex AI AutoML models (vertex_l2l / tide / tft / seq2seq) run as Tabular Workflow
# pipelines or managed training jobs. The Vertex SDK is in [gcp]; this adds the pipeline components
# the Tabular Workflow path compiles against.
models-automl = [
    "scale-forecasting[gcp]",
    "google-cloud-pipeline-components>=2.14",
]
# Full optional model suite (statistical + boosted-tree + Prophet + deep-learning + Vertex AutoML),
# composed from the family extras so every version floor is declared exactly once.
models = [
    "scale-forecasting[models-stats,models-trees,models-prophet,models-dl,models-automl]",
]
# Everything: every client, every model library, both on-cluster runtimes, the notebook kernel.
# This is what `uv sync --all-extras` (CI, `make sync`) resolves to, spelled as one installable name.
all = [
    "scale-forecasting[gcp,notebook,spark,ray,submit,models]",
]

[dependency-groups]
dev = [
    # A bare `uv sync` installs core + this group. Core is the pure layer, so without this line a
    # fresh clone could not reach BigQuery or plot; the clients and the kernel ride along here so
    # `uv sync` keeps meaning "a venv that can run the notebooks and the live tests". The heavy
    # runtimes and model libraries stay behind `--extra` / `--all-extras` (`make sync`).
    "scale-forecasting[gcp,notebook]",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2,<4",
    # Parses the executed notebooks the acceptance harness downloads, to scan for cell errors
    # (scale_forecasting.notebook_acceptance). Dev-only: the harness is a test/CI tool, not part of
    # the shipped forecasting runtime, so it doesn't belong in core deps.
    "nbformat>=5.10",
    # tests/unit/test_docs_integrity.py imports `pymdownx.slugs` directly to compute heading anchors
    # with the exact slugify MkDocs is configured with (mkdocs.yml `toc.slugify`), so a cross-link that
    # resolves on the published site is checked the same way here. It arrives transitively through the
    # `docs` group (mkdocs-material), but the CI `offline` job syncs `--all-extras` WITHOUT that group —
    # which is how `main` went red on 2026-10-06 with a ModuleNotFoundError that no local venv (where
    # `make docs` had already installed it) could reproduce. Same rule as threadpoolctl/protobuf above:
    # a module we import by name is a dependency we declare by name.
    "pymdown-extensions>=10",
]
# Documentation site (MkDocs Material + mkdocstrings). Builds the guides, the notebook tour, and an
# API reference generated straight from the source docstrings. mkdocstrings-python uses griffe's
# STATIC analysis (it reads src/, never imports the package), so the site builds without the heavy
# compute backends (statsmodels/scipy/torch) or a resolved runtime — CI stays light.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-jupyter>=0.25",
]

# --- torch CUDA build selection (Ray-on-Vertex T4 GPU path) --------------------------------------
# torch defaults to a CUDA-13 wheel on PyPI, which won't initialize on the Vertex T4 host driver
# (535.x → CUDA 12.2 max). Pull the CUDA-12.6 build FROM the PyTorch index, but only on Linux
# x86_64 — the runtime image (docker/Dockerfile) and every cluster node. On macOS / other platforms
# (local dev) there is no CUDA wheel, so we fall back to the default PyPI build (CPU/MPS), keeping
# `uv sync` working everywhere. The [ray]/@gpu path is Linux-only by construction, so this is the
# only place the GPU build is needed.
[tool.uv]
# The two environments the lock resolves for: the Linux x86_64 runtime (container, Dataproc, Vertex,
# GKE, GCE, CI) and Apple-silicon macOS for local development. Intel macOS is deliberately absent:
# torch — required by the [models] extra — has shipped no x86_64 macOS wheel since 2.3, so a bare
# `sys_platform == 'darwin'` environment asks the resolver for a split it cannot satisfy. The
# previously committed lock carried that split with an arm64-only wheel (an Intel Mac would have
# failed at `uv sync`), and `uv lock --check` accepted it because it does not re-resolve — but a
# fresh `uv lock` refuses outright ("No solution found"), which turned every dependency edit into a
# hard error until the environment was narrowed to what the wheels actually support.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scale_forecasting"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade — plus the families added for v1.0.0:
#   SIM   flake8-simplify        collapsible ifs, suppressible excepts, combined `with` blocks
#   C4    flake8-comprehensions  no needless list()/dict()/set() calls or comprehensions
#   PIE   flake8-pie             range(0, n), dict(**kw) for a literal, duplicate class fields
#   PERF  perflint               needless copies and allocations inside loops
#   RUF   ruff-specific          mutable class defaults, unused noqa, confusable characters, …
#   BLE   flake8-blind-except    every `except Exception` carries `# noqa: BLE001` and a reason.
#                                The package already marked its deliberate broad catches that way
#                                by convention (the worker must turn any model failure into an error
#                                cell, the probes must survive any client error); the rule makes the
#                                convention a gate, so a new broad catch cannot land unexplained.
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "PERF", "RUF", "BLE"]
ignore = [
    # PERF401 wants every `for …: out.append(f(x))` rewritten as a comprehension or `extend`. The
    # loops it flags here are explicit on purpose — a guard clause, a multi-line constructor, or a
    # body a reader scans top to bottom — and the rewrite is cosmetic churn with no measurable gain.
    "PERF401",
]
# Typographic characters the docstrings and comments use deliberately: × for machine shapes and
# products, – for ranges, − for a negative in prose, α for the exponential-smoothing parameter.
# RUF001–RUF003 still fire on every other confusable (a Cyrillic а, a fullwidth comma, …).
allowed-confusables = ["×", "–", "−", "α"]

[tool.mypy]
python_version = "3.11"
packages = ["scale_forecasting"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Scientific / ML libraries that ship no type stubs. We depend on them at runtime but
# treat their surfaces as untyped rather than vendoring stubs.
[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "statsforecast.*",
    "scipy.*",
    "xgboost.*",
    "lightgbm.*",
    "catboost.*",
    "prophet.*",
    "neuralprophet.*",
    "neuralforecast.*",
    "sklearn.*",
    "google_cloud_pipeline_components.*",
    "kfp.*",
    "threadpoolctl.*",
]
ignore_missing_imports = true

# pyspark is runtime-mounted on Dataproc Serverless (the optional [spark] extra); engines/seed
# import it lazily inside run()/main(). We treat its surface as untyped — `follow_imports = "skip"`
# (not just ignore_missing_imports) so the result is identical whether or not the extra happens to
# be installed in the current venv, keeping the mypy gate reproducible across dev/CI/cluster.
[[tool.mypy.overrides]]
module = ["pyspark.*"]
ignore_missing_imports = true
follow_imports = "skip"

# google.protobuf ships no py.typed marker in our resolved version; we touch it only to
# build the dynamic Storage Write API descriptor in registry/bq.py. Treat as untyped rather
# than pin types-protobuf (which must track the runtime protobuf version).
[[tool.mypy.overrides]]
module = ["google.protobuf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gcp: requires a GCP project + ADC (integration; off by default)",
    "spark: needs a local or serverless Spark session",
    "ray: needs a local or remote Ray runtime",
    "raylive: provisions a live (billed) Vertex Ray cluster — CPU-only, opt-in",
    "gpu: needs a real GPU (T4)",
    "slow: long-running (scale smokes)",
    "airflow: needs apache-airflow installed (parses an emitted DAG; opt-in, isolated)",
]

# Coverage is measured by the offline gate (`make test`, `make ci-offline`, the CI `offline` job)
# over the package only. The floor is a ratchet, not a target: it sits just under the figure the
# suite measured when it was introduced (85.77 % line coverage at v1.0.0, 17,905 statements) so a
# refactor cannot trip it but deleting tests does. Raise it when coverage rises; never lower it.
# The uncovered tail is the cloud-launch code the live smoke ledger proves instead
# (`vertex_submit`, `gce_submit`, `airflow_tasks`, `seed_spark`, `notebook_acceptance`).
# `--cov` is passed by those three commands rather than set in `addopts` so the bare-venv
# `core-install` job and the `airflow-parse` job, which have no pytest-cov, still run pytest.
[tool.coverage.run]
source = ["scale_forecasting"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true
