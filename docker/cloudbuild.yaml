# Cloud Build config — build the shared Spark runtime image, push it to Artifact Registry, and emit
# the packed-venv archive that the Dataproc-*cluster* path uses to get its dependencies.
#
# Build on demand from the repo root:
#
#   gcloud builds submit --config docker/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPO=scale-forecasting,_IMAGE=spark-runtime,_TAG=latest \
#     --project <PROJECT_ID>
#
# The Artifact Registry repo (`_REPO`) is created by terraform/main/modules/container. Dataproc
# Serverless requires a **linux/amd64** image; Cloud Build's default workers are amd64, so a plain
# `docker build` produces the right architecture (no buildx/QEMU needed).
#
# WHY the packed-venv step: Dataproc Serverless + Ray-on-Vertex both consume this container directly,
# but a Dataproc *cluster* can't use a custom container — so the cluster path ships the exact same
# locked env as an archive attached to the job (--archives=…#env). The image's /opt/venv is built
# fully SELF-CONTAINED (its uv/python-build-standalone interpreter is bundled in-tree — see
# docker/Dockerfile), so the archive is just a plain tar of that tree: it unpacks to ./env and
# ./env/bin/python runs on a bare cluster node with no Python of its own. We build it FROM this
# image's /opt/venv (one source of truth for deps, no drift) and upload it to the code bucket at
# envs/<hash>.tar.gz. Skipped when _CODE_BUCKET is empty (image-only manual builds).
#
# A git-push-triggered rebuild (Cloud Build trigger) is deferred until the GitHub repo connection
# exists; until then this is the explicit, cost-reviewed build step.

substitutions:
  _REGION: us-central1
  _REPO: scale-forecasting
  _IMAGE: spark-runtime
  _TAG: latest
  _CODE_BUCKET: "" # code bucket for the packed-venv archive; empty = skip the pack/upload
  _VENV_HASH: "latest" # archive object name envs/<hash>.tar.gz (Terraform passes the requirements md5)

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - docker/Dockerfile
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}"
      - .

  # Pack the image's self-contained /opt/venv into an archive. /opt/venv already bundles its own
  # interpreter and is relocatable (see docker/Dockerfile), so a plain tar of the tree is all that's
  # needed — no venv-pack (the image is intentionally pip-less). Tar the venv's CONTENTS (-C /opt/venv
  # .) so Dataproc's --archives=…#env fragment unpacks to ./env/{bin,lib,_python,…} and
  # ./env/bin/python resolves via the in-tree relative symlink. Run as root (the venv is root-owned);
  # the just-built tag is present in the local daemon, so no pull is needed.
  - id: pack-venv
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_CODE_BUCKET}" ]; then
          echo "no _CODE_BUCKET set; skipping packed-venv archive"
          exit 0
        fi
        docker run --rm --user root -v /workspace:/workspace \
          "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}" \
          bash -c "tar czf /workspace/env.tar.gz -C /opt/venv ."

  # Upload to the code bucket at the content-addressed path the app resolves (SF_VENV_ARCHIVE /
  # terraform venv_archive_uri output). Bucket versioning keeps prior archives recoverable.
  - id: upload-venv
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -z "${_CODE_BUCKET}" ]; then
          echo "no _CODE_BUCKET set; skipping packed-venv upload"
          exit 0
        fi
        gsutil cp /workspace/env.tar.gz "gs://${_CODE_BUCKET}/envs/${_VENV_HASH}.tar.gz"

options:
  logging: CLOUD_LOGGING_ONLY
