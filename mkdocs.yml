site_name: scale-forecasting
site_url: https://statmike.github.io/scale-forecasting/
site_description: >-
  Enterprise time-series forecasting on Google Cloud — Spark, Ray,
  Vertex AI, GKE, Compute Engine, and BigQuery, one config away.
repo_url: https://github.com/statmike/scale-forecasting
repo_name: statmike/scale-forecasting
edit_uri: blob/main/docs/
docs_dir: docs

# The *_template.py files are copy-me starting points, not pages — keep them in the repo (linked
# to GitHub) but out of the built site so mkdocs-jupyter doesn't render them as notebooks.
# assets/README.md documents the static asset generator and is not a site navigation page.
exclude_docs: |
  model_template.py
  metric_template.py
  assets/README.md
  assets/social_card.html

theme:
  name: material
  features:
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # griffe reads the source statically from src/ — the package is never imported, so the
          # site builds without the heavy compute backends and independent of the PEP 562 lazy root.
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_source: true
            filters: ["!^_"]
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
      # Match GitHub's heading-anchor algorithm so cross-links resolve identically on GitHub and the
      # rendered site (handles " — " → "--" and dropped punctuation the same way).
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

